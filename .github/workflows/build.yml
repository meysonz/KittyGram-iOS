name: Build KittyGram

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Bazel configuration (debug_arm64 builds much faster, release_arm64 is optimized)"
        type: choice
        default: debug_arm64
        options:
          - debug_arm64
          - release_arm64

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          df -h / || true
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          # Other Xcode versions, simulators and toolchains this build never uses.
          for x in /Applications/Xcode*.app; do
            case "$x" in
              "/Applications/Xcode_${XCODE_VERSION}.app") ;;
              *) [ -L "$x" ] || sudo rm -rf "$x" & ;;
            esac
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/hostedtoolcache" \
            /Users/runner/hostedtoolcache "$HOME/Library/Developer/CoreSimulator/Caches" /usr/local/lib/node_modules \
            "$HOME/.ghcup" /opt/homebrew/Caskroom "$HOME/Library/Caches/Homebrew" &
          wait
          df -h / || true

      - name: Check secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          IPA_ZIP_PASSWORD: ${{ secrets.IPA_ZIP_PASSWORD }}
        run: |
          for v in TG_API_ID TG_API_HASH IPA_ZIP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Missing secret: $v"; exit 1; fi
          done

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chmod 777 /Users/Shared
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Download Bazel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd /Users/Shared/telegram-ios
          BAZEL_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          BAZEL_SHA=$(python3 -c 'import json;print(json.load(open("versions.json"))["bazel"].split(":")[1])')
          NAME="bazel-${BAZEL_VERSION}-darwin-arm64"
          mkdir -p build-input
          for i in 1 2 3 4 5; do
            rm -f "build-input/$NAME"
            gh release download "$BAZEL_VERSION" -R bazelbuild/bazel -p "$NAME" -D build-input && break
            echo "download attempt $i failed"; sleep 15
          done
          chmod +x "build-input/$NAME"
          echo "$BAZEL_SHA  build-input/$NAME" | shasum -a 256 -c -

      - name: Pre-seed Bazel with large GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DISTDIR=/Users/Shared/bazel_distdir
          REPOCACHE=/Users/Shared/bazel_repo_cache
          mkdir -p "$DISTDIR" "$REPOCACHE"
          # github.com release downloads of rules_rust return 504 for plain HTTP clients; the authenticated API works
          for i in 1 2 3 4 5; do
            rm -f "$DISTDIR/rules_rust-0.74.0.tar.gz"
            gh release download 0.74.0 -R bazelbuild/rules_rust -p rules_rust-0.74.0.tar.gz -D "$DISTDIR" && break
            echo "rules_rust download attempt $i failed"; sleep 15
          done
          SUM=$(shasum -a 256 "$DISTDIR/rules_rust-0.74.0.tar.gz" | cut -d' ' -f1)
          test "$SUM" = "d8bcc1e111e98270dc03172e22ef7af9c2f94f3269801618a2b83d20890f8df5"
          mkdir -p "$REPOCACHE/content_addressable/sha256/$SUM"
          cp "$DISTDIR/rules_rust-0.74.0.tar.gz" "$REPOCACHE/content_addressable/sha256/$SUM/file"
          printf 'common --distdir=%s\ncommon --repository_cache=%s\n' "$DISTDIR" "$REPOCACHE" > "$HOME/.bazelrc"
          cat "$HOME/.bazelrc"

      - name: Restore Bazel cache
        id: bazelcache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel_disk_cache
          key: bazel-${{ inputs.configuration }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ inputs.configuration }}-

      - name: Build the app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -x
          cd /Users/Shared/telegram-ios

          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 - <<'EOF'
          import json, os
          src = "build-system/appstore-configuration.json"
          cfg = json.load(open(src))
          cfg["api_id"] = os.environ["TG_API_ID"]
          cfg["api_hash"] = os.environ["TG_API_HASH"]
          json.dump(cfg, open("build-system/kittygram-configuration.json", "w"), indent=2)
          EOF

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          touch /tmp/kittygram_build_start
          set -o pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if python3 -u build-system/Make/Make.py \
              --bazelUserRoot="$BAZEL_USER_ROOT" \
              --cacheDir=/Users/Shared/bazel_disk_cache \
              build \
              --configurationPath="build-system/kittygram-configuration.json" \
              --codesigningInformationPath=build-system/fake-codesigning \
              --configuration="${CONFIGURATION:-debug_arm64}" \
              --buildNumber="$BUILD_NUMBER" 2>&1 | tee /tmp/kittygram_build.log; then
              ok=1
              break
            fi
            df -h / || true
            if grep -qE "No space left on device|: error: |error: emit-module command failed" /tmp/kittygram_build.log; then
              echo "Not a network problem (compile error or full disk), not retrying"
              break
            fi
            echo "Build attempt $attempt failed, retrying"
            sleep 60
          done
          [ "$ok" = 1 ]

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          find -L bazel-bin/Telegram -maxdepth 1 -name '*.ipa' 2>/dev/null || true
          find bazel-out -name '*.ipa' -not -path '*/external/*' 2>/dev/null | head -20 || true
          IPA=$(find -L bazel-bin/Telegram -maxdepth 1 -name 'Telegram.ipa' 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            IPA=$(find bazel-out -name 'Telegram.ipa' -not -path '*/external/*' 2>/dev/null | head -1)
          fi
          echo "IPA found: $IPA"
          test -n "$IPA"
          cp "$IPA" "$OUTPUT_PATH/KittyGram.ipa"

          # Sideload variant for a free Apple ID: no app extensions, no watch app
          OUT_ABS="$(pwd)/$OUTPUT_PATH"
          STRIP_DIR="$(mktemp -d)"
          unzip -q "$OUT_ABS/KittyGram.ipa" -d "$STRIP_DIR"
          rm -rf "$STRIP_DIR"/Payload/*.app/PlugIns "$STRIP_DIR"/Payload/*.app/Watch
          # Own bundle id so the app never replaces the real Telegram; stop claiming the tg:// scheme
          APP_PLIST="$(ls -d "$STRIP_DIR"/Payload/*.app)/Info.plist" python3 - <<'PYEOF'
          import os, plistlib
          OLD = "ph.telegra.Telegraph"
          NEW = "com.meysonz.kittygram"
          path = os.environ["APP_PLIST"]
          with open(path, "rb") as f:
              data = plistlib.load(f)
          def fix(v):
              if isinstance(v, str):
                  return v.replace(OLD, NEW)
              if isinstance(v, list):
                  return [fix(x) for x in v]
              if isinstance(v, dict):
                  return {fix(k): fix(x) for k, x in v.items()}
              return v
          data = fix(data)
          for t in data.get("CFBundleURLTypes", []):
              t["CFBundleURLSchemes"] = [x for x in t.get("CFBundleURLSchemes", []) if x != "tg"]
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          print("bundle id:", data.get("CFBundleIdentifier"))
          PYEOF
          (cd "$STRIP_DIR" && zip -q -r -y "$OUT_ABS/KittyGram-sideload.ipa" Payload)
          rm -rf "$STRIP_DIR" "$OUT_ABS/KittyGram.ipa"
          ls -la "$OUTPUT_PATH"
          df -h / || true

      - name: Trim Bazel cache
        if: always()
        run: |
          CACHE=/Users/Shared/bazel_disk_cache
          [ -d "$CACHE" ] || exit 0
          du -sh "$CACHE" || true
          SIZE_KB=$(du -sk "$CACHE" | cut -f1)
          if [ "$SIZE_KB" -gt 5000000 ] && [ -f /tmp/kittygram_build_start ]; then
            find "$CACHE" -type f ! -newer /tmp/kittygram_build_start -delete || true
            du -sh "$CACHE" || true
          fi

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel_disk_cache
          key: bazel-${{ inputs.configuration }}-${{ github.run_id }}

      - name: Encrypt IPA
        env:
          IPA_ZIP_PASSWORD: ${{ secrets.IPA_ZIP_PASSWORD }}
        run: |
          cd /Users/Shared/telegram-ios/build/artifacts
          zip -P "$IPA_ZIP_PASSWORD" KittyGram-ipa.zip KittyGram-sideload.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyGram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/KittyGram-ipa.zip
          retention-days: 14
